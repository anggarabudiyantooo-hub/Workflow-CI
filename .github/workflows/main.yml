# workflow CI: re-training model tiap ada push (bisa juga run manual di tab Actions)
# urutannya: mlflow run -> artefak disimpan ke repo ini -> build image docker, push ke Docker Hub.
# secrets yang harus diisi di repo ini (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# kalau secrets belum diisi, step docker di-skip dan workflow tetap hijau.

name: CI Retrain Model Churn

on:
  push:
  workflow_dispatch:

# login shell wajib supaya conda ter-init dan mlflow menemukan perintah "activate"
defaults:
  run:
    shell: bash -l {0}

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Siapkan conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true

      - name: Install mlflow dan library model
        # lewat python -m pip supaya semua paket masuk ke interpreter yang sama
        run: python -m pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==2.1.3

      - name: Jalankan MLflow Project (training ulang model)
        run: mlflow run MLProject

      - name: Simpan artefak hasil training ke repo ini
        uses: actions/upload-artifact@v4
        with:
          name: hasil-training-model
          path: mlruns/
          retention-days: 30

      - name: Build image docker dari model, push ke Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "run id hasil training: $RUN_ID"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          # --env-manager local dipakai karena template default (virtualenv) meminta
          # python3.9 yang sudah tidak tersedia di apt, sehingga build selalu gagal
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "$DOCKERHUB_USERNAME/msml-telco-churn" --env-manager local
          docker push "$DOCKERHUB_USERNAME/msml-telco-churn:latest"

      - name: Rangkuman
        run: echo "workflow selesai. artefak training ada di tab Actions -> Artifacts."
